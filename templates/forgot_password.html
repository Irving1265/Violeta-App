{% extends 'base.html' %}

{% block styles %}
<style>
    .recovery-status {
        border-radius: 12px;
        border: 1px solid transparent;
        padding: 0.8rem 0.95rem;
        font-size: 0.92rem;
        line-height: 1.45;
        margin-bottom: 1rem;
    }

    .recovery-status-success {
        background: rgba(16, 185, 129, 0.18);
        border-color: rgba(16, 185, 129, 0.35);
        color: #86efac;
    }

    .recovery-status-danger {
        background: rgba(239, 68, 68, 0.18);
        border-color: rgba(239, 68, 68, 0.35);
        color: #fca5a5;
    }

    .recovery-status-warning {
        background: rgba(245, 158, 11, 0.2);
        border-color: rgba(245, 158, 11, 0.35);
        color: #fcd34d;
    }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-card">
        <!-- Back Button -->
        <button class="back-btn" onclick="goBack()">
            <i class="fas fa-chevron-left"></i>
        </button>

        <div class="register-header">
            <h2 class="register-title">VIOLETA</h2>
            <p class="text-muted">Recupera tu cuenta</p>
        </div>

        <div class="mb-4">
            <h3 class="step-heading">Encuentra tu cuenta</h3>
            <p class="text-muted text-center mb-4 small">
                Ingresa tu correo electrónico y te enviaremos instrucciones para recuperar tu cuenta.
            </p>

            <div id="recoveryStatus" class="recovery-status d-none" role="status" aria-live="polite"></div>

            <div class="mb-4" id="emailContainer">
                <input type="email" class="violet-input" placeholder="nombre@ejemplo.com" id="recovery-email" required>
                <div class="violet-error" id="emailError" style="display: none;"></div>
            </div>

            <button type="button" class="violet-btn-primary w-100" id="sendRecoveryBtn">Enviar Instrucciones</button>

            <div class="auth-footer mt-4">
                <p>¿Recordaste tu contraseña? <a href="{{ url_for('login') }}" class="link-highlight">Inicia Sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    let retryCountdownTimer = null;

    function goBack() {
        window.location.href = "{{ url_for('login') }}";
    }

    function validateEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
    }

    function showRecoveryPopup(message) {
        if (typeof showVioletNotification === 'function') {
            // 2 minutos en pantalla, salvo que la usuaria lo cierre antes.
            showVioletNotification(message, 'info', 120000);
            return;
        }
        alert(message);
    }

    function startRetryCooldown(seconds = 60) {
        const sendBtn = document.getElementById('sendRecoveryBtn');
        if (!sendBtn) return;

        if (retryCountdownTimer) {
            clearInterval(retryCountdownTimer);
            retryCountdownTimer = null;
        }

        let remaining = Number(seconds) || 0;
        sendBtn.disabled = true;
        sendBtn.textContent = `Reenviar en ${remaining}s`;

        retryCountdownTimer = setInterval(() => {
            remaining -= 1;
            if (remaining <= 0) {
                clearInterval(retryCountdownTimer);
                retryCountdownTimer = null;
                sendBtn.disabled = false;
                sendBtn.textContent = 'Reenviar Instrucciones';
                return;
            }
            sendBtn.textContent = `Reenviar en ${remaining}s`;
        }, 1000);
    }

    function setStatus(type, message) {
        const status = document.getElementById('recoveryStatus');
        const mappedType = ['success', 'danger', 'warning'].includes(type) ? type : 'warning';
        status.className = `recovery-status recovery-status-${mappedType}`;
        status.textContent = message;
        status.classList.remove('d-none');
    }

    function clearStatus() {
        const status = document.getElementById('recoveryStatus');
        status.classList.add('d-none');
        status.textContent = '';
    }

    function sendRecovery() {
        const emailInput = document.getElementById('recovery-email');
        const emailError = document.getElementById('emailError');
        const sendBtn = document.getElementById('sendRecoveryBtn');
        const email = emailInput.value.trim();
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';

        emailInput.classList.remove('error');
        emailError.style.display = 'none';
        clearStatus();

        if (!email) {
            emailInput.classList.add('error');
            emailError.textContent = 'El correo electrónico es requerido';
            emailError.style.display = 'block';
            return;
        }

        if (!validateEmail(email)) {
            emailInput.classList.add('error');
            emailError.textContent = 'Formato de correo inválido';
            emailError.style.display = 'block';
            return;
        }

        sendBtn.disabled = true;
        sendBtn.textContent = 'Enviando...';

        fetch('{{ url_for("forgot_password_request") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({ email })
        })
            .then(async response => {
                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.error || 'No pudimos procesar la solicitud.');
                }
                const recoveryMsg = 'Hemos enviado un correo con instrucciones para restablecer tu contraseña. Si no lo encuentras, revisa tu bandeja de spam. Si no lo recibes en el siguiente minuto, puedes volver a intentarlo.';
                setStatus('success', recoveryMsg);
                showRecoveryPopup(recoveryMsg);
                startRetryCooldown(60);
            })
            .catch(error => {
                if (retryCountdownTimer) {
                    clearInterval(retryCountdownTimer);
                    retryCountdownTimer = null;
                }
                const message = error?.message || 'No pudimos enviar el correo de recuperación.';
                setStatus('danger', message);
                emailInput.classList.add('error');
                sendBtn.textContent = 'Enviar Instrucciones';
            })
            .finally(() => {
                if (!retryCountdownTimer) {
                    sendBtn.disabled = false;
                }
            });
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('sendRecoveryBtn')?.addEventListener('click', sendRecovery);

        document.getElementById('recovery-email')?.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendRecovery();
            }
        });
    });
</script>
{% endblock %}
