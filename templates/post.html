<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ post.caption }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}" />
    <script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
    <style>
        #map {
            height: 400px; /* Ajusta la altura del mapa */
        }
    </style>
</head>
<body>
    <h1>{{ post.caption }}</h1>
    <img src="{{ url_for('uploaded_file', filename=post.image_filename) }}" alt="{{ post.caption }}">
    
    {% if post.latitude is not none and post.longitude is not none %}
    <!-- Contenedor del mapa -->
    <div id="map"></div>

    <input type="hidden" id="latitude" value="{{ post.latitude }}">
    <input type="hidden" id="longitude" value="{{ post.longitude }}">
    {% endif %}

    <script>
        const mexicoBounds = L.latLngBounds([14.3, -118.8], [32.9, -86.5]);
        function applyMapLimits(map) {
            const sz = map.getSize ? map.getSize() : null;
            if (!sz || sz.x < 120 || sz.y < 120) return false;
            const fitZoom = map.getBoundsZoom(mexicoBounds, false, L.point(10, 10));
            const minZoom = Math.max(4, Number.isFinite(fitZoom) ? Math.floor(fitZoom) : 4);
            map.setMinZoom(minZoom);
            map.options.minZoom = minZoom;
            if (map.getZoom() < minZoom) {
                map.setZoom(minZoom, { animate: false });
            }
            map.setMaxBounds(mexicoBounds.pad(0.02));
            map.options.maxBoundsViscosity = 1.0;
            return true;
        }

        const latInput = document.getElementById('latitude');
        const lngInput = document.getElementById('longitude');
        if (latInput && lngInput) {
            const latitude = parseFloat(latInput.value);
            const longitude = parseFloat(lngInput.value);
            if (!Number.isNaN(latitude) && !Number.isNaN(longitude)) {
                const map = L.map('map').setView([latitude, longitude], 13);
                map.whenReady(() => {
                    let retries = 0;
                    const applyWithRetry = () => {
                        if (!applyMapLimits(map) && retries < 20) {
                            retries += 1;
                            setTimeout(applyWithRetry, 120);
                        }
                    };
                    applyWithRetry();
                });
                map.on('resize', () => applyMapLimits(map));
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                L.marker([latitude, longitude]).addTo(map)
                    .bindPopup('Ubicación: ' + latitude + ', ' + longitude)
                    .openPopup();
            }
        }
    </script>
</body>
</html>
