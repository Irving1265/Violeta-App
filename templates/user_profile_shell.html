{% extends 'base.html' %}

{% block content %}
<div class="container px-0 profile-page-shell">
    <section id="deferredPageSkeleton" class="placeholder-glow py-4">
        <div class="profile-header profile-hero-card mb-4">
            <div class="profile-cover"></div>
            <div class="profile-card-body">
                <div class="profile-info">
                    <div class="profile-avatar-wrap">
                        <span class="placeholder profile-avatar-skeleton" aria-hidden="true"></span>
                    </div>
                    <div class="profile-identity-row">
                        <div class="profile-details">
                            <span class="placeholder col-5 mb-3" style="height: 2.2rem;"></span>
                            <span class="placeholder col-4 mb-2" style="height: 0.9rem;"></span>
                        </div>

                        <div class="profile-stats">
                            {% for _ in range(3) %}
                            <div class="stat-item">
                                <span class="placeholder col-8 mb-2" style="height: 1.4rem;"></span>
                                <span class="placeholder col-10" style="height: 0.8rem;"></span>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="profile-content-layout">
            <aside class="profile-side-stack">
                <span class="placeholder d-block w-100" style="height: 260px; border-radius: 24px;"></span>
                <span class="placeholder d-block w-100" style="height: 78px; border-radius: 24px;"></span>
            </aside>
            <section class="profile-feed-panel">
                <div class="profile-section-header">
                    <div>
                        <span class="placeholder col-3 mb-2" style="height: 0.8rem;"></span>
                        <span class="placeholder col-5" style="height: 1.5rem;"></span>
                    </div>
                </div>
                <div class="profile-grid">
                    {% for _ in range(6) %}
                    <span class="placeholder d-block w-100" style="aspect-ratio: 1 / 1; border-radius: 22px;"></span>
                    {% endfor %}
                </div>
            </section>
        </div>
    </section>

    <div id="deferredPageError" class="alert alert-danger" hidden>
        No se pudo cargar el perfil. Recarga la página.
    </div>

    <div id="deferredPageMount" hidden aria-busy="true"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
window.DEFERRED_PAGE_CONFIG = {
  mountId: 'deferredPageMount',
  skeletonId: 'deferredPageSkeleton',
  errorId: 'deferredPageError',
  contentUrl: {{ url_for('user_profile_content', username=user.username, page=page)|tojson }},
  scriptSrcs: [
    {{ (url_for('static', filename='js/user_profile_page.js') ~ '?v=20260920-profile-reference')|tojson }}
  ],
  initFn: 'initUserProfileEnhancements'
};
</script>
<script defer src="{{ url_for('static', filename='js/deferred_page_loader.js') }}?v=20260402-progressive-v2"></script>
{% endblock %}
