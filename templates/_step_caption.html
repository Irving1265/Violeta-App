<section id="step2" class="pc-step step-content" data-step-panel="2" aria-labelledby="postStepCaptionTitle" hidden>
    <div class="pc-step-copy-block">
        <h3 id="postStepCaptionTitle" class="pc-step-copy-block__title">Detalles del reporte</h3>
        <p class="pc-step-copy-block__subtitle">Describe el problema.</p>
    </div>

    <div class="pc-step-scroll">
        <div class="form-group">
            <label for="pcCaptionInput">Descripcion</label>
            <div class="pc-textarea-wrap">
                <textarea id="pcCaptionInput" name="caption" rows="4" maxlength="500"
                    aria-describedby="pcCaptionHelp pcCaptionCount"
                    placeholder="Escribe aqui..."></textarea>
                <span id="pcCaptionCount" class="form-counter" hidden>0 / 500</span>
            </div>
            <p id="pcCaptionHelp" class="form-help">Explica brevemente lo que se ve en la foto.</p>
        </div>

        <div class="form-group">
            <label>Categorias <span class="form-required">*</span></label>
            <p class="form-help">Selecciona al menos una categoria.</p>

            <div class="pc-categories-list">
                <label class="pc-category-item pc-category-option">
                    <input type="checkbox" name="categories" value="Poca iluminación">
                    <i class="fas fa-lightbulb" aria-hidden="true"></i>
                    <span>Poca iluminación</span>
                </label>

                <label class="pc-category-item pc-category-option">
                    <input type="checkbox" name="categories" value="Banquetas en mal estado">
                    <i class="fas fa-road" aria-hidden="true"></i>
                    <span>Banquetas en mal estado</span>
                </label>

                <label class="pc-category-item pc-category-option">
                    <input type="checkbox" name="categories" value="Zona insegura">
                    <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
                    <span>Zona insegura</span>
                </label>

                <label class="pc-category-item pc-category-option">
                    <input type="checkbox" name="categories" value="Terrenos baldíos">
                    <i class="fas fa-tree" aria-hidden="true"></i>
                    <span>Terrenos baldíos</span>
                </label>
            </div>
            <p id="pcCategoriesError" class="form-error" role="alert"></p>
        </div>

        {% if current_user.is_authenticated and current_user_can_override_content_controls %}
        <div class="form-group pc-publish-panel">
            <label>Publicacion</label>
            <p class="form-help">Elige cuando se hara publica la publicacion.</p>
            <div class="pc-publish-options">
                <label class="pc-publish-option">
                    <input type="radio" name="pcPublishMode" value="now" checked>
                    <span>Publicar ahora</span>
                </label>
                <label class="pc-publish-option">
                    <input type="radio" name="pcPublishMode" value="delay">
                    <span>Publicar en 15 min</span>
                </label>
                <label class="pc-publish-option">
                    <input type="radio" name="pcPublishMode" value="schedule">
                    <span>Programar fecha y hora</span>
                </label>
            </div>
            <div class="pc-publish-schedule" id="pcPublishAtWrap" hidden>
                <label for="pcPublishAt">Fecha y hora</label>
                <input type="datetime-local" id="pcPublishAt" class="pc-input">
            </div>
            <p id="pcPublishError" class="form-error" role="alert"></p>
        </div>
        {% endif %}
    </div>
</section>
