apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseSigningValue = { String propertyName, String envName ->
    def propertyValue = keystoreProperties[propertyName]?.toString()?.trim()
    if (propertyValue) {
        return propertyValue
    }
    return System.getenv(envName)?.trim()
}

def resolveReleaseStoreFile = { String storeFilePath ->
    if (!storeFilePath) {
        return null
    }
    def candidate = file(storeFilePath)
    return candidate.isAbsolute() ? candidate : rootProject.file(storeFilePath)
}

def releaseStoreFilePath = releaseSigningValue('storeFile', 'ANDROID_KEYSTORE_PATH')
def releaseStoreFile = resolveReleaseStoreFile(releaseStoreFilePath)
def releaseStorePassword = releaseSigningValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = releaseSigningValue('keyAlias', 'ANDROID_KEY_ALIAS')
def releaseKeyPassword = releaseSigningValue('keyPassword', 'ANDROID_KEY_PASSWORD')
def releaseSigningConfigured = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "com.violeta.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.violeta.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

gradle.taskGraph.whenReady { taskGraph ->
    if (!releaseSigningConfigured && (taskGraph.hasTask(':app:bundleRelease') || taskGraph.hasTask(':app:assembleRelease'))) {
        throw new GradleException('Android release signing no esta configurado. Crea android/keystore.properties o define ANDROID_KEYSTORE_* antes de generar un build de tienda.')
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
