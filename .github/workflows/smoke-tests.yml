name: Critical Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-checks:
    name: Flask smoke and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      PYTHON_DOTENV_DISABLED: "1"
      BACKGROUND_JOBS_INLINE: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      APP_ENV: "ci"
      SECRET_KEY: "violeta-ci-critical-checks-secret"
      DATABASE_URL: "sqlite:///${{ github.workspace }}/instance/critical_checks.sqlite3"
      DATABASE_REQUIRE_SSL: "false"
      UPLOAD_BACKEND: "local"
      UPLOAD_FOLDER: "${{ github.workspace }}/static/uploads"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare CI runtime folders
        run: mkdir -p instance static/uploads

      - name: Run critical checks
        run: python scripts/ci_checks.py
